<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- 波浪效果 -->
  <path d="M 20,64 Q 35,45 50,64 T 80,64 T 110,64" stroke="#fff" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 20,75 Q 35,56 50,75 T 80,75 T 110,75" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- 中心文字样式的装饰 -->
  <rect x="40" y="40" width="48" height="48" rx="8" fill="#fff" opacity="0.9"/>
  
  <!-- 几枝的简化表示 -->
  <text x="64" y="70" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#333">几</text>
</svg>